[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

  [functions.proxy-ai]
    timeout = 26

  [functions.opsec-checkout]
    timeout = 15

  [functions.opsec-access-verify]
    timeout = 10

  [functions.opsec-sector-write]
    timeout = 15

  [functions.opsec-sector-read]
    timeout = 15
  [functions.tg-voice]
    timeout = 26
    included_files = ["config/**"]

  [functions.tg-idea-generator]
    timeout = 26

  [functions.tg-intake-submit]
    timeout = 26
  [functions.tg-evaluate-stage]
    timeout = 26

  [functions.tg-chamber-questions]
    timeout = 26

  [functions.tg-chamber-summary]
    timeout = 26

  [functions.tg-evaluation-get]
    timeout = 10

  [functions.tg-ivy-search]
    timeout = 15

  [functions.tg-ep-briefings]
    timeout = 26

  [functions.tg-ep-postchamber-quotes]
    timeout = 26
    included_files = ["config/**"]

  [functions.tg-file-extract]
    timeout = 26
    external_node_modules = ["pdf-parse", "mammoth"]

  [functions.tg-export-docx]
    timeout = 15
    external_node_modules = ["docx"]

  [functions.tg-ep-chat]
    timeout = 26
    included_files = ["config/**"]
  [functions.tg-wren-scout]
    timeout = 26
    included_files = ["config/**"]

  [functions.tg-wren-patent-queries]
    timeout = 26
    included_files = ["config/**"]

  [functions.tg-wren-patent-analyze]
    timeout = 26
    included_files = ["config/**"]

  [functions.tg-ivy-generate]
    timeout = 26
    included_files = ["config/**"]

  [functions.tg-ivy-context]
    timeout = 26
    included_files = ["config/**"]
  [functions.tg-score-original-background]
    included_files = ["config/**"]

  [functions.tg-consult-request]
    timeout = 10

  [functions.tg-wren-patent-analyze-background]
    included_files = ["config/**"]

  [functions.tg-wren-patent-status]
    timeout = 10
